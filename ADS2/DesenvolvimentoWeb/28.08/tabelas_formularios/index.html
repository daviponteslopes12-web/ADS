<!DOCTYPE html><!-- Não fecha -> são apenas configurações e não elementos -->
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplicando os conceitos de tabelas, formulários e validação em HTML">
    <!-- description faz a descrição da sua página -->
    <title>Tabelas e Formulários</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            margin: 10px;
        }

        table {
            border-collapse: collapse;
            border: 4px double black;
        }

        table th, table td {
            border: 1px solid black;
            padding: 8px;
        }

        form {
            color: #fff;
            border: 2px solid black;
            padding: 12px;
            background-color: #474040;
        }


        h2, h1 {
            text-align: center;
            margin: 10px 0;
            text-decoration: underline;
        }

        .table-box {
            display: flex;
            justify-content: center;
        }

        .form-box {
            display: flex;
            justify-content: center;
        }

        label {
            font: bold;
        }

        input {
            border: none;
            border-radius: 5px;
            padding: 5px;
            margin: 8px;
            width: 93%;
            margin-bottom: 25px;
        }

        button {
            padding: 5px;
            border-radius: 15px;
            border: none;
            font: bold;
            width: 100%;
            cursor: pointer;
        }

        fieldset {
            padding: 12px;
        }

        legend {
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <h1>Tabelas e Formulários</h1>

    </header>

    <main>

        <section>
            <h2>Tabela</h2>

            <div class="table-box">
                <table>
                    <caption>Estoque - setor de vegetais</caption>
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Quantidade</th>
                            <th>Preço (R$)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Batata</td>
                            <td>6</td>
                            <td>6,00</td>
                        </tr>
                        <tr>
                            <td>Cenoura</td>
                            <td>22</td>
                            <td>5,00</td>
                        </tr>
                        <tr>
                            <td>Alface</td>
                            <td>18</td>
                            <td>7,00</td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td>Total</td>
                            <td>18,00</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </section>

        <section>
            <h2>Formulário</h2>

            <div class="form-box">    
                <form action="">
                    <fieldset>
                        <legend>Cadastro de Produtos</legend>
                        <label for="produto">Nome do Produto:</label>
                        <input type="text" id="produto" placeholder="Maçã..." required minlength="2"><br>
                        
                        <label for="quantidade">Quantidade:</label>
                        <input type="number" id="quantidade" placeholder="12" required><br>
                        
                        <label for="preco">Preço (R$):</label>
                        <input type="number" step="0.01" id="preco" placeholder="12,50" required><br>
                        
                        <button type="submit">Cadastrar</button>
                    </fieldset>
                </form>
            </div>
        </section>
    </main>
</body>

</html>

<!--
PARANDO DE APANHAR PARA CENTRALIZAÇÃO!!!

1. text-align: center; -> usado para centralizar textos in line.

2. margin: 0 auto; -> centralizar um elemento de bloco horizontalmente (defina o width do elemento!!).

3. display: flex; + justify-content: center; -> centralização flexível, centraliza horizontalmente os filhos.

4. display: grid; + place-items: center; -> centralização simples, centraliza vertical e horizontal (se estiver usando ou for usar grid)

5. position: absolute; + transform: ; -> posicionamento preciso (tem que ser mais específico, espero não ter que usar 😐)


-->
